<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FA26 · PHYS 211: Practice 20 — Socratic Companion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.__katexReady && window.__katexReady()"></script>
  <style>
    :root {
      --bg: #0c111a;
      --surface: #141c2b;
      --surface-alt: #1b2538;
      --text: #edf2f9;
      --text-muted: #9fb0c7;
      --border: #28364e;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-dark: #2563eb;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.16);
      --ok-bg: rgba(34, 197, 94, 0.14);
      --ok-border: #22c55e;
      --ok-text: #86efac;
      --warn-bg: rgba(251, 146, 60, 0.14);
      --warn-border: #fb923c;
      --warn-text: #fdba74;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-alt: #f0f4fa;
      --text: #141d2b;
      --text-muted: #526176;
      --border: #d8e1ee;
      --primary: #1d4ed8;
      --primary-soft: #e8f0fe;
      --primary-dark: #163ca8;
      --accent: #7c3aed;
      --accent-soft: #f3e8ff;
      --ok-bg: #ecfdf3;
      --ok-border: #16a34a;
      --ok-text: #14532d;
      --warn-bg: #fff7ed;
      --warn-border: #ea580c;
      --warn-text: #7c2d12;
      --shadow: 0 2px 10px rgba(20, 29, 43, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      font-size: 16px;
    }

    .app-shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* Header */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      min-width: 0;
    }

    .header-center {
      display: flex;
      justify-content: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .theme-toggle {
      min-height: 36px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    }

    .theme-toggle:focus-visible {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }

    .course-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--primary);
      display: block;
    }

    .app-title {
      margin: 1px 0 0;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .progress-pill {
      flex-shrink: 0;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .progress-pill strong {
      color: var(--primary);
    }

    /* Problem Selector Strip */
    .nav-strip-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
    }

    .nav-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .nav-strip::-webkit-scrollbar {
      display: none;
    }

    .prob-tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .prob-tab:focus-visible,
    .tier-pill:focus-visible,
    .opt-btn:focus-visible,
    .nav-btn:focus-visible,
    .reset-btn:focus-visible {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }

    .prob-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .prob-tab.done:not(.active) {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }

    .tab-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.35;
    }

    .prob-tab.done .tab-dot,
    .prob-tab.active .tab-dot {
      opacity: 1;
    }

    /* Main Card */
    .main-content {
      flex: 1;
      padding: 14px 14px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .paper-ref {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 5px 10px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .paper-cue {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0 0 12px;
    }

    /* Tier Switcher */
    .tier-bar {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    .tier-pill {
      min-height: 36px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .tier-pill.active {
      background: #93c5fd;
      border-color: #93c5fd;
      color: #0b1220;
    }

    [data-theme="light"] .tier-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .tier-pill.solved:not(.active) {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }

    .tier-pill.twist {
      border-color: #c4b5fd;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tier-pill.twist.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Question */
    .tier-heading {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 0 0 6px;
    }

    .tier-heading.twist-heading {
      color: var(--accent);
    }

    .question-text {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 10px;
      line-height: 1.45;
    }

    .self-check-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: var(--text);
    }

    .self-check-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .self-check-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
    }

    .self-check-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 28px;
    }

    .self-check-body {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.42;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      font-size: 0.94rem;
      line-height: 1.4;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s, transform 0.05s;
    }

    .opt-btn:active {
      transform: scale(0.99);
    }

    .opt-letter {
      flex: 0 0 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .opt-body {
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .opt-btn.selected-correct {
      border-color: var(--ok-border);
      background: var(--ok-bg);
    }

    .opt-btn.selected-correct .opt-letter {
      background: var(--ok-border);
      border-color: var(--ok-border);
      color: #ffffff;
    }

    .opt-btn.selected-wrong {
      border-color: var(--warn-border);
      background: var(--warn-bg);
    }

    .opt-btn.selected-wrong .opt-letter {
      background: var(--warn-border);
      border-color: var(--warn-border);
      color: #ffffff;
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 12px;
      border-left: 4px solid transparent;
      font-size: 0.92rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.visible {
      display: block;
    }

    .feedback-box.correct {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }

    .feedback-box.wrong {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .feedback-label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      display: block;
    }

    /* Footer Navigation */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .nav-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .nav-btn.primary:hover {
      background: var(--primary-dark);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 4px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .reset-btn {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 5px 9px;
      min-height: 32px;
      white-space: nowrap;
    }

    /* Clean Offline Math Fallback Styling */
    .math {
      white-space: nowrap;
      font-family: "Times New Roman", Georgia, serif;
      font-size: 1.04em;
    }
    .vec {
      font-weight: 700;
      font-style: italic;
    }
    .katex {
      font-size: 1.02em;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div class="header-left">
          <span class="course-tag">FA26 · PHYS 211 · PRACTICE 20</span>
          <h1 class="app-title">Torque &amp; Angular Momentum</h1>
        </div>
        <div class="header-center">
          <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Switch between dark and light mode">
            <span id="themeIcon">&#9728;&#65039;</span>
            <span id="themeLabel">Light</span>
          </button>
        </div>
        <div class="header-right">
          <button type="button" class="reset-btn" id="resetBtn">Reset</button>
          <div class="progress-pill" id="progressPill"><strong>0</strong> / 8 done</div>
        </div>
      </div>
    </header>

    <nav class="nav-strip-wrap" aria-label="Worksheet Problems">
      <div class="nav-strip" id="probNav"></div>
    </nav>

    <main class="main-content">
      <section class="card" id="questionCard" aria-live="polite"></section>
    </main>
  </div>

  <script>
    // Helper: creates an inline math span that upgrades to KaTeX when online,
    // and renders clean semantic HTML/Unicode when offline (zero raw TeX delimiters).
    function m(tex, htmlFallback) {
      const safeTex = tex.replace(/"/g, "&quot;");
      return `<span class="math" data-tex="${safeTex}">${htmlFallback}</span>`;
    }

    const WORKSHEET_DATA = [
      {
        id: "P1-1",
        shortLabel: "P1 #1",
        paperRef: "Part 1 · #1",
        cue: "Hanging mass <i>m</i> &mdash; Newton's 2nd Law for <i>T</i><sub>R</sub>",
        tiers: [
          {
            <!-- Tier 1 · Force Comparison & Direction -->
            question: `With ${m("m", "<i>m</i>")} accelerating upward, how does upward ${m("T_R", "<i>T</i><sub>R</sub>")} compare to weight ${m("mg", "<i>mg</i>")}?`,
            selfCheck: `Sketch a free-body diagram for ${m("m", "<i>m</i>")} with upward ${m("T_R", "<i>T</i><sub>R</sub>")}, downward ${m("mg", "<i>mg</i>")}, and upward ${m("a", "<i>a</i>")} first.`,
            options: [
              {
                id: "A",
                text: `${m("T_R = mg", "<i>T</i><sub>R</sub> = <i>mg</i>")}, because the string simply supports the mass.`,
                isCorrect: false,
                feedback: `If ${m("T_R = mg", "<i>T</i><sub>R</sub> = <i>mg</i>")}, the net force on the block would be zero, meaning zero acceleration. Re-check the problem statement: the block is accelerating upward.`
              },
              {
                id: "B",
                text: `${m("T_R > mg", "<i>T</i><sub>R</sub> &gt; <i>mg</i>")}, so the net force points upward in the direction of acceleration ${m("a", "<i>a</i>")}.`,
                isCorrect: true,
                feedback: `Right! Choosing upward as positive gives a positive net force (${m("T_R", "<i>T</i><sub>R</sub>")} minus weight) equal to ${m("ma", "<i>ma</i>")}. Write your Newton's 2nd Law equation on paper and isolate ${m("T_R", "<i>T</i><sub>R</sub>")}.`
              },
              {
                id: "C",
                text: `${m("T_R < mg", "<i>T</i><sub>R</sub> &lt; <i>mg</i>")}, because the pulley absorbs some of the tension.`,
                isCorrect: false,
                feedback: `The massive pulley does make ${m("T_R", "<i>T</i><sub>R</sub>")} smaller than ${m("T_L", "<i>T</i><sub>L</sub>")}, but ${m("T_R", "<i>T</i><sub>R</sub>")} must still beat ${m("mg", "<i>mg</i>")} for the hanging mass to accelerate upward rather than fall.`
              },
              {
                id: "D",
                text: `${m("T_R = T_L", "<i>T</i><sub>R</sub> = <i>T</i><sub>L</sub>")}, because both sides are part of the same string.`,
                isCorrect: false,
                feedback: `That only holds for a massless, frictionless pulley. Here the pulley has mass ${m("M", "<i>M</i>")}, so a net torque is required to spin it—meaning ${m("T_L \\neq T_R", "<i>T</i><sub>L</sub> &ne; <i>T</i><sub>R</sub>")}.`
              }
            ]
          }
        ]
      },
      {
        id: "P1-2",
        shortLabel: "P1 #2",
        paperRef: "Part 1 · #2",
        cue: "Cylindrical pulley (<i>M</i>, <i>R</i>) &mdash; Rotational Newton's 2nd Law",
        tiers: [
          {
            <!-- Tier 1 · Torque Signs & Rotation Sense -->
            question: `For counterclockwise pulley rotation as the right mass rises, how do ${m("T_L", "<i>T</i><sub>L</sub>")} and ${m("T_R", "<i>T</i><sub>R</sub>")} torques combine in ${m("\\sum \\tau = I\\alpha", "&Sigma;&tau; = <i>I&alpha;</i>")}?`,
            selfCheck: `Draw ${m("T_L", "<i>T</i><sub>L</sub>")} (left rim, down) and ${m("T_R", "<i>T</i><sub>R</sub>")} (right rim, down) on the pulley and check each rotation sense first.`,
            options: [
              {
                id: "A",
                text: `Both tensions produce torques in the same direction, so their magnitudes add.`,
                isCorrect: false,
                feedback: `Trace the string on both sides of the pulley: ${m("T_L", "<i>T</i><sub>L</sub>")} pulls downward on the left (counterclockwise), while ${m("T_R", "<i>T</i><sub>R</sub>")} pulls downward on the right (clockwise). They oppose each other.`
              },
              {
                id: "B",
                text: `They oppose each other, with ${m("T_L", "<i>T</i><sub>L</sub>")} producing the positive (driving) torque and ${m("T_R", "<i>T</i><sub>R</sub>")} opposing it.`,
                isCorrect: true,
                feedback: `Spot on! Defining counterclockwise as positive matches the upward acceleration of mass ${m("m", "<i>m</i>")}. Remember that each tension acts at radius ${m("R", "<i>R</i>")} tangent to the rim.`
              },
              {
                id: "C",
                text: `They oppose each other, with ${m("T_R", "<i>T</i><sub>R</sub>")} producing the larger torque because it holds the hanging mass.`,
                isCorrect: false,
                feedback: `If the torque from ${m("T_R", "<i>T</i><sub>R</sub>")} were larger, the pulley would accelerate clockwise and the hanging mass would fall. Since the mass rises, ${m("T_L", "<i>T</i><sub>L</sub>")} must win the tug-of-war.`
              },
              {
                id: "D",
                text: `Only ${m("T_L", "<i>T</i><sub>L</sub>")} exerts a torque; ${m("T_R", "<i>T</i><sub>R</sub>")} only acts on the hanging mass.`,
                isCorrect: false,
                feedback: `By Newton's 3rd Law, the right-hand string pulls upward on mass ${m("m", "<i>m</i>")} and downward on the right rim of the pulley with equal magnitude ${m("T_R", "<i>T</i><sub>R</sub>")}. Both tensions exert torques on the pulley.`
              }
            ]
          },
          {
            <!-- Tier 2 · Rotational Inertia Model -->
            question: `Which rotational inertia ${m("I", "<i>I</i>")} fits the cylindrical pulley (${m("M", "<i>M</i>")}, ${m("R", "<i>R</i>")}) in ${m("\\sum \\tau = I\\alpha", "&Sigma;&tau; = <i>I&alpha;</i>")}?`,
            options: [
              {
                id: "A",
                text: `${m("I = MR^2", "<i>I</i> = <i>MR</i><sup>2</sup>")}`,
                isCorrect: false,
                feedback: `${m("MR^2", "<i>MR</i><sup>2</sup>")} describes a thin hoop where all the mass sits at the outer rim. A solid cylindrical pulley has mass distributed all the way from the axle to the rim, so its rotational inertia is smaller.`
              },
              {
                id: "B",
                text: `${m("I = \\frac{1}{2}MR^2", "<i>I</i> = &frac12;<i>MR</i><sup>2</sup>")}`,
                isCorrect: true,
                feedback: `Correct! A solid uniform cylinder spinning about its central axis has ${m("I = \\frac{1}{2}MR^2", "<i>I</i> = &frac12;<i>MR</i><sup>2</sup>")}. Combine your net torque and this ${m("I", "<i>I</i>")} on paper to finish #2.`
              },
              {
                id: "C",
                text: `${m("I = \\frac{2}{5}MR^2", "<i>I</i> = (2/5)<i>MR</i><sup>2</sup>")}`,
                isCorrect: false,
                feedback: `That's the rotational inertia of a solid sphere, not a cylinder. Check your moment-of-inertia table for a solid cylinder or disk about its central axis.`
              }
            ]
          }
        ]
      },
      {
        id: "P1-3",
        shortLabel: "P1 #3",
        paperRef: "Part 1 · #3",
        cue: "No-slip constraint <i>a</i> = <i>R&alpha;</i> in the pulley equation",
        tiers: [

                feedback: `Gravity never turns off when you move! The downward gravitational force and the tipping torque when you lean are still present.`
              },
              {
                id: "B",
                text: `Spinning wheels carry a large angular momentum ${m("\\vec{L}", "<span class='vec'>L</span>")}; via ${m("\\vec{\\tau} = d\\vec{L}/dt", "<span class='vec'>&tau;</span> = d<span class='vec'>L</span>/dt")}, a small tipping torque changes the direction of ${m("\\vec{L}", "<span class='vec'>L</span>")} gradually (precession) rather than toppling the bike immediately.`,
                isCorrect: true,
                feedback: `Well reasoned! When stationary, ${m("\\vec{L} = 0", "<span class='vec'>L</span> = 0")}, so any lean produces an unopposed gravitational torque that rapidly tips the bike over. When rolling, the large horizontal ${m("\\vec{L}", "<span class='vec'>L</span>")} resists rapid changes in orientation. Write a crisp 2–3 sentence explanation on paper using ${m("\\vec{L}", "<span class='vec'>L</span>")} and ${m("\\vec{\\tau} = d\\vec{L}/dt", "<span class='vec'>&tau;</span> = d<span class='vec'>L</span>/dt")}.`
              },
              {
                id: "C",
                text: `Forward motion eliminates any gravitational torque when the bike leans slightly.`,
                isCorrect: false,
                feedback: `As soon as the center of mass shifts to one side of the tire contact line, gravity still creates a nonzero torque. The difference is how the wheel's existing angular momentum responds to that torque.`
              },
              {
                id: "D",
                text: `The wheels' rotational inertia ${m("I", "<i>I</i>")} increases as the bike speeds up.`,
                isCorrect: false,
                feedback: `Rotational inertia ${m("I", "<i>I</i>")} depends only on the mass distribution of the wheels, not their speed. It is the angular momentum ${m("L = I\\omega", "<i>L</i> = <i>I&omega;</i>")} that grows with speed.`
              }
            ]
          }
        ]
      },
      {
        id: "P2-4",
        shortLabel: "P2 #4",
        paperRef: "Part 2 · #4",
        cue: "Collapsing spinning star (<i>I</i> drops to 2/5 <i>I</i><sub>i</sub>) &mdash; rotational KE ratio",
        tiers: [
          {
            <!-- Tier 1 · Conservation Law & Spin Rate -->
            question: `With zero external torque during collapse, what is conserved and how does ${m("\\omega", "&omega;")} change?`,
            options: [
              {
                id: "A",
                text: `Rotational kinetic energy ${m("K_{\\text{rot}}", "<i>K</i><sub>rot</sub>")} stays constant, so the ratio ${m("K_f / K_i", "<i>K</i><sub>f</sub> / <i>K</i><sub>i</sub>")} is simply 1.`,
                isCorrect: false,
                feedback: `Careful! Internal gravitational forces do work as the star pulls its mass inward, so rotational kinetic energy is NOT conserved here. Ask instead which quantity is conserved when net external torque is zero.`
              },
              {
                id: "B",
                text: `Angular velocity ${m("\\omega", "&omega;")} stays constant, so ${m("K_{\\text{rot}}", "<i>K</i><sub>rot</sub>")} drops in direct proportion to ${m("I", "<i>I</i>")}.`,
                isCorrect: false,
                feedback: `Think of a figure skater pulling their arms in: when rotational inertia ${m("I", "<i>I</i>")} decreases with no external torque, the spin rate ${m("\\omega", "&omega;")} cannot stay constant—it speeds up dramatically.`
              },
              {
                id: "C",
                text: `Angular momentum ${m("L = I\\omega", "<i>L</i> = <i>I&omega;</i>")} is conserved, so when ${m("I", "<i>I</i>")} drops to ${m("\\frac{2}{5}", "2/5")} of its initial value, ${m("\\omega", "&omega;")} increases by the inverse factor.`,
                isCorrect: true,
                feedback: `Exactly! Zero external torque means ${m("I_i \\omega_i = I_f \\omega_f", "<i>I</i><sub>i</sub>&omega;<sub>i</sub> = <i>I</i><sub>f</sub>&omega;<sub>f</sub>")}. Set up that relation on paper before heading to Tier 2.`
              }
            ]
          },
          {
            <!-- Tier 2 · Scaling of Rotational Kinetic Energy -->
            question: `With ${m("L", "<i>L</i>")} constant and ${m("I", "<i>I</i>")} shrinking, how does ${m("K_{\\text{rot}} = \\frac{1}{2}I\\omega^2 = \\frac{L^2}{2I}", "<i>K</i><sub>rot</sub> = &frac12;<i>I&omega;</i><sup>2</sup> = <i>L</i><sup>2</sup> / (2<i>I</i>)")} change?`,
            options: [
              {
                id: "A",
                text: `It increases, because ${m("K_{\\text{rot}}", "<i>K</i><sub>rot</sub>")} is inversely proportional to ${m("I", "<i>I</i>")} when ${m("L", "<i>L</i>")} is fixed (the ${m("\\omega^2", "&omega;<sup>2</sup>")} increase beats the linear drop in ${m("I", "<i>I</i>")}).`,
                isCorrect: true,
                feedback: `Spot on! Using either ${m("K = L^2 / (2I)", "<i>K</i> = <i>L</i><sup>2</sup> / (2<i>I</i>)")} or substituting your new ${m("\\omega_f", "&omega;<sub>f</sub>")} into ${m("\\frac{1}{2}I_f\\omega_f^2", "&frac12;<i>I</i><sub>f</sub>&omega;<sub>f</sub><sup>2</sup>")}, compute the exact ratio ${m("K_f / K_i", "<i>K</i><sub>f</sub> / <i>K</i><sub>i</sub>")} on your worksheet—it should be greater than 1.`
              },
              {
                id: "B",
                text: `It decreases, because ${m("I", "<i>I</i>")} is smaller and ${m("K_{\\text{rot}}", "<i>K</i><sub>rot</sub>")} is proportional to ${m("I", "<i>I</i>")}.`,
                isCorrect: false,
                feedback: `That would only be true if ${m("\\omega", "&omega;")} were held fixed. Because ${m("\\omega", "&omega;")} is squared in ${m("\\frac{1}{2}I\\omega^2", "&frac12;<i>I&omega;</i><sup>2</sup>")}, the jump in ${m("\\omega^2", "&omega;<sup>2</sup>")} more than compensates for the drop in ${m("I", "<i>I</i>")}.`
              },
              {
                id: "C",
                text: `It increases by the square of the inverse factor, because you only need to square the change in ${m("\\omega", "&omega;")}.`,
                isCorrect: false,
                feedback: `Close, but don't forget that ${m("I_f", "<i>I</i><sub>f</sub>")} itself also got smaller in ${m("\\frac{1}{2}I_f\\omega_f^2", "&frac12;<i>I</i><sub>f</sub>&omega;<sub>f</sub><sup>2</sup>")}! One factor cancels out. Writing ${m("K = L^2/(2I)", "<i>K</i> = <i>L</i><sup>2</sup>/(2<i>I</i>)")} makes the scaling unmistakable.`
              }
            ]
          }
        ],
        extensionTwist: {
          title: "Optional: Extension / Twist",
          question: `With zero external torque on the collapsing star, where does the extra rotational kinetic energy come from?`,
          options: [
            {
              id: "A",
              text: `Internal gravitational forces pull the star's mass inward, converting gravitational potential energy into rotational kinetic energy.`,
              isCorrect: true,
              feedback: `Exactly right! Internal forces can't change the system's total angular momentum (their internal torques cancel in pairs), but they CAN do net positive work—transforming gravitational potential energy into faster rotation.`
            },
            {
              id: "B",
              text: `Energy is not conserved whenever angular momentum is conserved.`,
              isCorrect: false,
              feedback: `Total energy is still conserved! Mechanical energy just shifts from one form (potential energy) into another (rotational kinetic energy).`
            },
            {
              id: "C",
              text: `The surrounding vacuum exerts an external torque that adds energy to the star.`,
              isCorrect: false,
              feedback: `A vacuum exerts no external torque—and if an external torque were acting, angular momentum ${m("L", "<i>L</i>")} wouldn't have been conserved in the first place.`
            }
          ]
        }
      }
    ];

    const STORAGE_KEY = "fa26_phys211_practice20_companion_v7";

    const state = {
      probIdx: 0,
      tierIdx: 0, // 0..tiers.length-1, or 'twist'
      hideSelfCheck: false,
      theme: "dark", // default dark mode
      answers: {} // key: `${probId}:${tierKey}` -> { selectedId, solved }
    };

    function applyTheme(theme) {
      const mode = theme === "light" ? "light" : "dark";
      state.theme = mode;
      if (mode === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
      const iconEl = document.getElementById("themeIcon");
      const labelEl = document.getElementById("themeLabel");
      if (iconEl && labelEl) {
        if (mode === "dark") {
          iconEl.innerHTML = "&#9728;&#65039;";
          labelEl.textContent = "Light";
        } else {
          iconEl.innerHTML = "&#127769;";
          labelEl.textContent = "Dark";
        }
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed.answers === "object") {
            state.answers = parsed.answers;
          }
          if (parsed && (parsed.theme === "dark" || parsed.theme === "light")) {
            state.theme = parsed.theme;
          }
        }
      } catch (_) {}
      applyTheme(state.theme);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          answers: state.answers,
          theme: state.theme
        }));
      } catch (_) {}
    }

    function getStepKey(prob, tierIdx) {
      return `${prob.id}:${tierIdx}`;
    }

    function isProblemSolved(prob) {
      return prob.tiers.every((_, idx) => {
        const rec = state.answers[getStepKey(prob, idx)];
        return rec && rec.solved;
      });
    }

    function renderMathIfAvailable(container) {
      if (!window.katex) return;
      const nodes = container.querySelectorAll(".math[data-tex]");
      nodes.forEach((el) => {
        const tex = el.getAttribute("data-tex");
        if (!tex) return;
        try {
          el.innerHTML = window.katex.renderToString(tex, {
            throwOnError: false,
            displayMode: false
          });
          el.removeAttribute("data-tex");
        } catch (_) {}
      });
    }

    window.__katexReady = function () {
      renderMathIfAvailable(document.body);
    };

    function renderNav() {
      const nav = document.getElementById("probNav");
      nav.innerHTML = "";
      let solvedCount = 0;

      WORKSHEET_DATA.forEach((prob, idx) => {
        const done = isProblemSolved(prob);
        if (done) solvedCount++;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "prob-tab" + (idx === state.probIdx ? " active" : "") + (done ? " done" : "");
        btn.innerHTML = `<span class="tab-dot"></span><span>${prob.shortLabel}</span>`;
        btn.addEventListener("click", () => {
          state.probIdx = idx;
          state.tierIdx = 0;
          render();
          btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        });
        nav.appendChild(btn);
      });

      const pill = document.getElementById("progressPill");
      pill.innerHTML = `<strong>${solvedCount}</strong> / ${WORKSHEET_DATA.length} done`;
    }

    function renderCard() {
      const prob = WORKSHEET_DATA[state.probIdx];
      const isTwist = state.tierIdx === "twist" && prob.extensionTwist;
      const activeItem = isTwist ? prob.extensionTwist : prob.tiers[state.tierIdx];
      const stepKey = getStepKey(prob, state.tierIdx);
      const record = state.answers[stepKey] || { selectedId: null, solved: false };

      const card = document.getElementById("questionCard");

      // Tier pills
      let tierPillsHtml = `<div class="tier-bar" role="tablist">`;
      prob.tiers.forEach((_, idx) => {
        const rec = state.answers[getStepKey(prob, idx)];
        const isActive = state.tierIdx === idx;
        const isSolved = rec && rec.solved;
        tierPillsHtml += `
          <button type="button" class="tier-pill ${isActive ? "active" : ""} ${isSolved ? "solved" : ""}" data-tier="${idx}">
            ${isSolved ? "&#10003; " : ""}Tier ${idx + 1}
          </button>`;
      });
      if (prob.extensionTwist) {
        const rec = state.answers[getStepKey(prob, "twist")];
        const isActive = isTwist;
        const isSolved = rec && rec.solved;
        tierPillsHtml += `
          <button type="button" class="tier-pill twist ${isActive ? "active" : ""} ${isSolved ? "solved" : ""}" data-tier="twist">
            ${isSolved ? "&#10003; " : ""}&#9733; Twist
          </button>`;
      }
      tierPillsHtml += `</div>`;

      // Options
      let optionsHtml = `<div class="options-list">`;
      activeItem.options.forEach((opt) => {
        let cls = "opt-btn";
        if (record.selectedId === opt.id) {
          cls += opt.isCorrect ? " selected-correct" : " selected-wrong";
        }
        optionsHtml += `
          <button type="button" class="${cls}" data-opt="${opt.id}">
            <span class="opt-letter">${opt.id}</span>
            <span class="opt-body">${opt.text}</span>
          </button>`;
      });
      optionsHtml += `</div>`;

      // Feedback
      let feedbackHtml = `<div class="feedback-box" id="feedbackBox"></div>`;
      if (record.selectedId) {
        const chosen = activeItem.options.find((o) => o.id === record.selectedId);
        if (chosen) {
          const kind = chosen.isCorrect ? "correct" : "wrong";
          const label = chosen.isCorrect ? "Good physical reasoning" : "Re-check that assumption";
          feedbackHtml = `
            <div class="feedback-box visible ${kind}" id="feedbackBox">
              <span class="feedback-label">${label}</span>
              <div>${chosen.feedback}</div>
            </div>`;
        }
      }

      // Footer buttons
      const hasNextTier = !isTwist && state.tierIdx < prob.tiers.length - 1;
      const hasTwistNext = !isTwist && state.tierIdx === prob.tiers.length - 1 && !!prob.extensionTwist;
      const hasNextProb = state.probIdx < WORKSHEET_DATA.length - 1;
      const hasPrevProb = state.probIdx > 0;

      let nextLabel = "Next Problem &rarr;";
      let nextDisabled = !hasNextProb;
      if (hasNextTier) {
        nextLabel = `Next: Tier ${state.tierIdx + 2} &rarr;`;
        nextDisabled = false;
      } else if (hasTwistNext) {
        nextLabel = "Try Twist &rarr;";
        nextDisabled = false;
      } else if (isTwist && hasNextProb) {
        nextLabel = "Next Problem &rarr;";
        nextDisabled = false;
      } else if (!hasNextProb) {
        nextLabel = "End of Worksheet";
        nextDisabled = true;
      }

      const headingHtml = isTwist
        ? `<p class="tier-heading twist-heading">${activeItem.title}</p>`
        : "";

      card.innerHTML = `
        <div class="card-meta">
          <span class="paper-ref">${prob.paperRef}</span>
          ${tierPillsHtml}
        </div>
        <p class="paper-cue">${prob.cue}</p>
        ${headingHtml}
        <p class="question-text">${activeItem.question}</p>
        ${activeItem.selfCheck ? `
          <div class="self-check-box" id="selfCheckBox">
            <div class="self-check-header">
              <span class="self-check-label">Paper-First</span>
              <button type="button" class="self-check-toggle" id="toggleSelfCheckBtn">${state.hideSelfCheck ? "Show prompt" : "Hide"}</button>
            </div>
            ${state.hideSelfCheck ? "" : `<p class="self-check-body">${activeItem.selfCheck}</p>`}
          </div>
        ` : ""}
        ${optionsHtml}
        ${feedbackHtml}
        <div class="card-footer">
          <button type="button" class="nav-btn" id="prevBtn" ${!hasPrevProb && state.tierIdx === 0 ? "disabled" : ""}>&larr; Back</button>
          <button type="button" class="nav-btn primary" id="nextBtn" ${nextDisabled ? "disabled" : ""}>${nextLabel}</button>
        </div>
      `;

      const toggleScBtn = document.getElementById("toggleSelfCheckBtn");
      if (toggleScBtn) {
        toggleScBtn.addEventListener("click", () => {
          state.hideSelfCheck = !state.hideSelfCheck;
          render();
        });
      }

      // Bind tier pills
      card.querySelectorAll(".tier-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          const val = btn.getAttribute("data-tier");
          state.tierIdx = val === "twist" ? "twist" : Number(val);
          render();
        });
      });

      // Bind options
      card.querySelectorAll(".opt-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const optId = btn.getAttribute("data-opt");
          const chosen = activeItem.options.find((o) => o.id === optId);
          if (!chosen) return;
          const prev = state.answers[stepKey] || { selectedId: null, solved: false };
          state.answers[stepKey] = {
            selectedId: optId,
            solved: prev.solved || chosen.isCorrect
          };
          saveState();
          render();
        });
      });

      // Bind prev/next
      const prevBtn = document.getElementById("prevBtn");
      prevBtn.addEventListener("click", () => {
        if (state.tierIdx === "twist") {
          state.tierIdx = prob.tiers.length - 1;
        } else if (state.tierIdx > 0) {
          state.tierIdx--;
        } else if (state.probIdx > 0) {
          state.probIdx--;
          state.tierIdx = 0;
        }
        render();
      });

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.addEventListener("click", () => {
        if (hasNextTier) {
          state.tierIdx++;
        } else if (hasTwistNext) {
          state.tierIdx = "twist";
        } else if (hasNextProb) {
          state.probIdx++;
          state.tierIdx = 0;
        }
        render();
      });

      renderMathIfAvailable(card);
    }

    function render() {
      renderNav();
      renderCard();
    }

    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      applyTheme(state.theme === "dark" ? "light" : "dark");
      saveState();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state.answers = {};
      state.probIdx = 0;
      state.tierIdx = 0;
      saveState();
      render();
    });

    loadState();
    render();
  </script>
</body>
</html>
